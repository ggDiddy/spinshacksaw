/* ═══════════════════════════════════════════════════════════════
   SlotsHacksaw — Main Stylesheet
   Shared across all pages (except homepage which has its own inline CSS)
   ═══════════════════════════════════════════════════════════════ */

:root {
  --bg: #21262c;
  --bg-2: #1a1e23;
  --bg-3: #2b3138;
  --line: #353b43;
  --line-soft: #2f353c;
  --blue: #025bff;
  --blue-2: #0b6bff;
  --blue-soft: rgba(2, 91, 255, 0.12);
  --fg-1: #ffffff;
  --fg-2: #c9ced4;
  --fg-3: #8a9099;
  --fg-4: #5c6168;
  --good: #25c26e;
  --warn: #f5a623;
  --red: #ef4444;
  --serif: "Instrument Serif", "Times New Roman", serif;
  --sans: "Inter", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html { scroll-behavior: smooth; }

html, body {
  background: var(--bg);
  color: var(--fg-1);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 0 24px; }
.wrap-narrow { max-width: 880px; margin: 0 auto; padding: 0 24px; }

/* ═══ NAVIGATION ═══ */
.site-nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(33, 38, 44, 0.92);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-soft);
}
.nav-inner {
  max-width: 1240px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 24px;
}
.nav-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 16px;
  color: #fff;
}
.nav-links {
  display: none;
  align-items: center;
  gap: 4px;
}
@media (min-width: 768px) {
  .nav-links { display: flex; }
}
.nav-link {
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  color: var(--fg-2);
  transition: all 0.2s;
}
.nav-link:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.06);
}
.nav-sep {
  width: 1px;
  height: 22px;
  background: var(--line);
  margin: 0 8px;
}
.nav-burger {
  display: flex;
  flex-direction: column;
  gap: 5px;
  background: transparent;
  border: 0;
  padding: 6px;
  color: var(--fg-2);
}
@media (min-width: 768px) {
  .nav-burger { display: none; }
}
.nav-burger span {
  display: block;
  width: 22px;
  height: 2px;
  background: currentColor;
  border-radius: 2px;
  transition: transform 0.22s, opacity 0.22s;
}
.nav-drawer {
  display: none;
  position: fixed;
  top: 57px;
  left: 0;
  right: 0;
  background: var(--bg-2);
  z-index: 49;
  flex-direction: column;
  padding: 12px 16px 20px;
  gap: 6px;
  border-top: 1px solid var(--line-soft);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4);
}
.nav-drawer.open { display: flex; }
.nav-drawer a {
  padding: 13px 14px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 500;
  color: var(--fg-2);
}
.nav-drawer a:hover {
  color: #fff;
  background: rgba(255, 255, 255, 0.05);
}

/* ═══ COMPLIANCE STRIP ═══ */
.compliance {
  background: var(--bg-2);
  border-bottom: 1px solid var(--line-soft);
  font-size: 12px;
  color: var(--fg-3);
}
.compliance-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 8px 24px;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
}
.badge-18 {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border-radius: 4px;
  background: #FF3B30;
  color: #fff;
  font-weight: 800;
  font-size: 10px;
  flex-shrink: 0;
}
.compliance a {
  color: var(--fg-2);
  text-decoration: underline;
}
.compliance a:hover { color: #fff; }

/* ═══ BUTTONS ═══ */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 13px 22px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
  border: none;
  transition: all 0.15s;
  cursor: pointer;
  font-family: inherit;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-2); }
.btn-secondary {
  background: transparent;
  color: #fff;
  border: 1px solid var(--line);
}
.btn-secondary:hover { background: var(--bg-3); }

/* ═══ CTA BUTTON ═══ */
.cta-btn {
  display: inline-block;
  padding: 11px 20px;
  background: var(--blue);
  color: #fff;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  border: none;
  text-align: center;
  transition: background 0.15s;
}
.cta-btn:hover { background: var(--blue-2); }

/* ═══ FAQ ACCORDION ═══ */
.faq-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 20px;
}
.faq-item {
  background: var(--bg-2);
  border: 1px solid var(--line-soft);
  border-radius: 12px;
  overflow: hidden;
}
.faq-q {
  width: 100%;
  padding: 18px 22px;
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  background: none;
  border: none;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  font-family: inherit;
  cursor: pointer;
}
.faq-q:hover { color: var(--blue); }
.faq-icon {
  font-size: 20px;
  color: var(--blue);
  flex-shrink: 0;
  transition: transform 0.22s;
  line-height: 1;
}
.faq-item.open .faq-icon { transform: rotate(45deg); }
.faq-a {
  display: none;
  padding: 0 22px 18px;
  font-size: 14.5px;
  color: var(--fg-2);
  line-height: 1.72;
  border-top: 1px solid var(--line-soft);
  padding-top: 16px;
}
.faq-item.open .faq-a { display: block; }

/* ═══ SECTION BASICS ═══ */
.section {
  padding: 64px 0;
  border-bottom: 1px solid var(--line-soft);
}
.section:last-child { border-bottom: none; }
.section-head {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 36px;
}
@media (min-width: 768px) {
  .section-head {
    flex-direction: row;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
  }
}
.kicker {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 12px;
}
.section-title {
  font-size: clamp(26px, 3.4vw, 44px);
  font-weight: 800;
  letter-spacing: -1px;
  line-height: 1.1;
  color: #fff;
}
.section-title em {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  color: var(--blue);
}
.section-sub {
  color: var(--fg-2);
  font-size: 15px;
  line-height: 1.65;
  max-width: 620px;
  margin-top: 12px;
}

/* ═══ INFO BOX ═══ */
.info-box {
  background: var(--bg-2);
  border: 1px solid var(--line-soft);
  border-left: 3px solid var(--blue);
  border-radius: 10px;
  padding: 16px 20px;
  margin: 20px 0;
  font-size: 14px;
  color: var(--fg-2);
  line-height: 1.7;
}
.info-box strong { color: #fff; }
.info-box.warn { border-left-color: var(--warn); }
.info-box a {
  color: var(--blue);
  text-decoration: underline;
}

/* ═══ CASINO TABLE ═══ */
.tbl-head {
  display: none;
  padding: 14px 24px;
  background: var(--bg-3);
  font-size: 10.5px;
  color: var(--fg-3);
  font-weight: 600;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  border-bottom: 1px solid var(--line);
}
@media (min-width: 1024px) {
  .tbl-head {
    display: grid;
    grid-template-columns: 44px 1.3fr 1.4fr 1fr 0.9fr auto;
    align-items: center;
    gap: 20px;
  }
}
.crow {
  border-top: 1px solid var(--line-soft);
  padding: 20px;
  position: relative;
  background: var(--bg-2);
}
@media (min-width: 1024px) {
  .crow {
    display: grid;
    grid-template-columns: 44px 1.3fr 1.4fr 1fr 0.9fr auto;
    align-items: center;
    gap: 20px;
    padding: 22px 24px;
  }
}
.crow.top {
  background: linear-gradient(90deg, rgba(2, 91, 255, 0.08), rgba(2, 91, 255, 0.01));
}
.crow.top::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--blue);
}
.crow-m {
  display: flex;
  flex-direction: column;
  gap: 14px;
}
@media (min-width: 1024px) {
  .crow-m { display: none; }
}
.crow-d { display: none; }
@media (min-width: 1024px) {
  .crow-d { display: contents; }
}
.rank-num {
  font-family: var(--serif);
  font-style: italic;
  font-size: 32px;
  color: var(--fg-3);
  text-align: center;
  line-height: 1;
}
.crow.top .rank-num { color: var(--blue); }
.casino-logo {
  width: 56px;
  height: 56px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 20px;
  letter-spacing: -0.5px;
  flex-shrink: 0;
  border: 1px solid rgba(255, 255, 255, 0.06);
}
.casino-logo.sm {
  width: 44px;
  height: 44px;
  font-size: 16px;
}
.casino-name {
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.3px;
  color: #fff;
}
.casino-name.sm { font-size: 15px; }
.casino-stars {
  display: inline-flex;
  gap: 2px;
  color: var(--blue);
  font-size: 12px;
}
.casino-stars .off { color: #3A4049; }
.casino-licence {
  font-size: 11px;
  color: var(--fg-3);
  margin-left: 8px;
}
.bonus-hl {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  letter-spacing: -0.2px;
}
.bonus-sub {
  font-size: 11px;
  color: var(--fg-3);
  margin-top: 3px;
}
.stat-mini {
  display: flex;
  flex-direction: column;
  gap: 3px;
}
.stat-mini-val {
  font-family: var(--mono);
  font-size: 13px;
  color: #fff;
  font-weight: 500;
}
.stat-mini-lbl {
  font-size: 11px;
  color: var(--fg-3);
}
.score-chip {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.5px;
  color: #fff;
  background: var(--blue);
  box-shadow: 0 0 0 4px rgba(2, 91, 255, 0.10);
  flex-shrink: 0;
}
.tbl-note {
  font-size: 11px;
  color: var(--fg-4);
  line-height: 1.6;
  margin-top: 16px;
}
.tbl-note a {
  color: var(--fg-3);
  text-decoration: underline;
}

/* ═══ FOOTER ═══ */
.site-footer {
  background: var(--bg-2);
  border-top: 1px solid var(--line-soft);
  padding: 44px 0 24px;
  margin-top: 40px;
}
.footer-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 32px;
  margin-bottom: 36px;
}
@media (min-width: 768px) {
  .footer-grid {
    grid-template-columns: 1.5fr 1fr 1fr 1fr;
    gap: 40px;
  }
}
.footer-brand-desc {
  font-size: 13.5px;
  color: var(--fg-2);
  line-height: 1.65;
  margin-top: 16px;
  max-width: 360px;
}
.footer-col-title {
  font-size: 11px;
  color: var(--fg-3);
  font-weight: 600;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.footer-col ul {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.footer-col a {
  font-size: 13.5px;
  color: var(--fg-2);
}
.footer-col a:hover { color: #fff; }
.footer-bottom {
  padding-top: 24px;
  border-top: 1px solid var(--line-soft);
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  font-size: 12px;
  color: var(--fg-4);
}
.footer-bottom a { color: var(--fg-4); }
.footer-bottom a:hover { color: var(--fg-2); }
.footer-rg {
  background: var(--bg);
  border: 1px solid var(--line-soft);
  border-radius: 12px;
  padding: 18px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
  margin-bottom: 24px;
}
.footer-rg-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 38px;
  height: 38px;
  border-radius: 8px;
  background: #FF3B30;
  color: #fff;
  font-weight: 800;
  font-size: 14px;
  flex-shrink: 0;
}
.footer-rg-text {
  font-size: 12.5px;
  color: var(--fg-2);
  line-height: 1.65;
}
.footer-rg-text strong { color: #fff; }

/* ═══ COOKIE BANNER ═══ */
#sh-cookie-banner {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #1a1e23;
  border-top: 1px solid #353b43;
  z-index: 9999;
  box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.4);
  display: none;
}
#sh-cookie-banner.show { display: block; }
.sh-cb-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 18px 24px;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.sh-cb-text {
  flex: 1;
  min-width: 280px;
  font-size: 13px;
  color: #c9ced4;
  line-height: 1.6;
}
.sh-cb-text strong { color: #fff; }
.sh-cb-text a {
  color: var(--blue);
  text-decoration: underline;
}
.sh-cb-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
.sh-cb-btn {
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  border: none;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
}
.sh-cb-accept { background: var(--blue); color: #fff; }
.sh-cb-accept:hover { background: var(--blue-2); }
.sh-cb-reject {
  background: transparent;
  color: #c9ced4;
  border: 1px solid #353b43;
}
.sh-cb-reject:hover { color: #fff; border-color: #5c6168; }
@media (max-width: 640px) {
  .sh-cb-inner { flex-direction: column; align-items: stretch; }
  .sh-cb-buttons button { flex: 1; }
}